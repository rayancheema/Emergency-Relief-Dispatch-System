<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Log Urgent Request</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container my-5" style="max-width: 500px;">
        <div class="card shadow p-4">
            <h2 class="mb-3 text-warning">Log Emergency Request</h2>

            {% if error %}
            <div class="alert alert-danger">{{ error }}</div>
            {% endif %}

            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Select Shelter:</label>
                    <select name="shelter_id" class="form-select" required>
                        <option value="" disabled selected>Select a shelter...</option>
                        {% for shelter in shelters %}
                        <option value="{{ shelter[0] }}">{{ shelter[0] }} - {{ shelter[1] }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Item Needed:</label>
                    <input type="text" name="item" class="form-control" required placeholder="e.g., First Aid Kit">
                </div>
                <div class="mb-3">
                    <label class="form-label">Quantity Required:</label>
                    <input type="number" name="qty" class="form-control" min="1" required placeholder="e.g., 50">
                </div>
                <div class="mb-3">
                    <label class="form-label">Urgency Level:</label>
                    <select name="urgency" class="form-select" required>
                        <option value="Critical">Critical</option>
                        <option value="High">High</option>
                        <option value="Moderate" selected>Moderate</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-warning w-100 text-dark fw-bold">Submit Request</button>
                <a href="/" class="btn btn-link w-100 mt-2">Back to Dashboard</a>
            </form>
        </div>
    </div>
</body>
</html>
