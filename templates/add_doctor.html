<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Doctor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container my-5" style="max-width: 600px;">
        <h2 class="mb-4 text-primary">🩺 Add Doctor</h2>
        <form method="POST" class="card p-4 shadow-sm">
            <div class="mb-3">
                <label class="form-label">Doctor ID</label>
                <input type="text" name="doctor_id" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Assign to Hospital</label>
                <select name="hospital_id" class="form-select" required>
                    <option value="">Select Hospital</option>
                    {% for h in hospitals %}
                    <option value="{{ h[0] }}">{{ h[1] }} (ID: {{ h[0] }})</option>
                    {% endfor %}
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Speciality (e.g., Pediatrician, Surgeon)</label>
                <input type="text" name="speciality" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Availability Status</label>
                <select name="availability_status" class="form-select">
                    <option value="Available">Available</option>
                    <option value="Unavailable">Unavailable</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary">Add Doctor</button>
            <a href="/" class="btn btn-secondary mt-2">Back to Dashboard</a>
        </form>
    </div>
</body>
</html>
