<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register Hospital</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container my-5" style="max-width: 600px;">
        <h2 class="mb-4 text-danger">🏥 Register New Hospital</h2>
        {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
        {% endif %}
        <form method="POST" class="card p-4 shadow-sm">
            <div class="mb-3">
                <label class="form-label">Hospital ID</label>
                <input type="text" name="hospital_id" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Hospital Name</label>
                <input type="text" name="name" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Coordinates (e.g., 34.05,-118.24)</label>
                <input type="text" name="coordinates" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-danger">Register Hospital</button>
            <a href="/" class="btn btn-secondary mt-2">Back to Dashboard</a>
        </form>
    </div>
</body>
</html>
