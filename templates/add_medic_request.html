<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Request Medic Support</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container my-5" style="max-width: 600px;">
        <h2 class="mb-4 text-dark">🚑 Request Medical Specialist</h2>
        {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
        {% endif %}
        <form method="POST" class="card p-4 shadow-sm">
            <div class="mb-3">
                <label class="form-label">Select Shelter</label>
                <select name="shelter_id" class="form-select" required>
                    <option value="">Select Shelter</option>
                    {% for s in shelters %}
                    <option value="{{ s[0] }}">{{ s[1] }} (ID: {{ s[0] }})</option>
                    {% endfor %}
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Required Speciality (e.g., Pediatrician)</label>
                <input type="text" name="speciality" class="form-control" required placeholder="e.g. Pediatrician">
            </div>
            <button type="submit" class="btn btn-dark">Find & Allocate Nearest Doctor</button>
            <a href="/" class="btn btn-secondary mt-2">Back to Dashboard</a>
        </form>
    </div>
</body>
</html>
