<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Warehouse Inventory</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css">
    <link rel="stylesheet" href="../static/style.css">
</head>

<body>
    <div class="bg-circle bg1"></div>
    <div class="bg-circle bg2"></div>
    <div class="bg-circle bg3"></div>

    <div class="auth-wrapper">
        <div class="auth-card" id="authCard">

            <!-- Login Form -->
            <div class="form-panel login-panel">
                <div class="logo">
                    <i class="fa-sharp fa-solid fa-pen-to-square"></i>
                </div>
                <h2>Add Warehouse Inventory</h2>

                {% if error %}
                <div class="alert alert-danger">{{ error }}</div>
                {% endif %}

                <form method="POST">
                    <!-- Warehouse ID -->
                    <div class="input-group">
                        <div class="electric-glow"></div>
                        <div class="electric-border"></div>
                        <input type="text" name="warehouse_id" placeholder=" " required>
                        <label for="WareHouse_ID">Warehouse ID</label>
                    </div>

                    <!-- Item -->
                    <div class="input-group">
                        <div class="electric-glow"></div>
                        <div class="electric-border"></div>
                        <input type="text" name="item" placeholder=" " required>
                        <label for="ItemName">Item Name</label>
                    </div>

                    <!-- Quantity -->
                    <div class="input-group">
                        <div class="electric-glow"></div>
                        <div class="electric-border"></div>
                        <input type="number" name="quantity" placeholder=" " min="1" required>
                        <label for="quantity">
                            Quantity
                        </label>
                    </div>

                    <button type="submit" class="main-btn">
                        Save Inventory Item
                    </button>
                </form>
                <div class="switch-area">
                    <span>
                        Return to Home Page
                    </span>
                    <a href="/"><button type="button" class="switch-circle"><i class="fa-solid fa-house"></i></button></a>
                </div>
            </div>

        </div>
    </div>
</body>

</html>
