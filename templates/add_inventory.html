<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Warehouse Inventory</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container my-5" style="max-width: 500px;">
        <div class="card shadow p-4">
            <h2 class="mb-3 text-primary">Add Warehouse Stock</h2>
            
            {% if error %}
            <div class="alert alert-danger">{{ error }}</div>
            {% endif %}

            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Warehouse ID:</label>
                    <input type="text" name="warehouse_id" class="form-control" required placeholder="e.g., WH-01">
                </div>
                <div class="mb-3">
                    <label class="form-label">Item Name:</label>
                    <input type="text" name="item" class="form-control" required placeholder="e.g., Bottled Water">
                </div>
                <div class="mb-3">
                    <label class="form-label">Quantity:</label>
                    <input type="number" name="quantity" class="form-control" min="0" required placeholder="e.g., 500">
                </div>
                <button type="submit" class="btn btn-primary w-100">Save Inventory Item</button>
                <a href="/" class="btn btn-link w-100 mt-2">Back to Dashboard</a>
            </form>
        </div>
    </div>
</body>
</html>
