<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register New Shelter</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css">
    <link rel="stylesheet" href="../static/style.css">
</head>

<body>
    <div class="bg-circle bg1"></div>
    <div class="bg-circle bg2"></div>
    <div class="bg-circle bg3"></div>

    <div class="auth-wrapper">
        <div class="auth-card" id="authCard">

            <!-- Login Form -->
            <div class="form-panel login-panel">
                <div class="logo">
                    <i class="fa-sharp fa-solid fa-pen-to-square"></i>
                </div>
                <h2 >Register New Shelter</h2>

                {% if error %}
                <div class="alert alert-danger">{{ error }}</div>
                {% endif %}

                <form method="POST">
                    <!-- Shelter ID -->
                    <div class="input-group">
                        <div class="electric-glow"></div>
                        <div class="electric-border"></div>
                        <input type="text" name="shelter_id" placeholder=" " required>
                        <label for="shelter_id">Shelter ID</label>
                    </div>

                    <!-- Shelter Name -->
                    <div class="input-group">
                        <div class="electric-glow"></div>
                        <div class="electric-border"></div>
                        <input type="text" name="name" placeholder=" " required>
                        <label for="name">Shelter Name</label>
                    </div>

                    
                    <!-- Priority -->
                    <div class="input-group">
                        <div class="electric-glow"></div>
                        <div class="electric-border"></div>
                        <select id="priority" name="priority" required>
                            <option value="" disabled selected hidden></option>
                            <option value="Critical">Critical</option>
                            <option value="High">High</option>
                            <option value="Moderate">Moderate</option>
                        </select>
                        <label for="priority">Priority Level</label>
                    </div>
                    <!-- Coordinates -->
                    <div class="input-group">
                        <div class="electric-glow"></div>
                        <div class="electric-border"></div>
                        <input type="text" name="coordinates" placeholder=" " required>
                        <label for="coordinates">Location Coordinates</label>
                    </div>

                    <button type="submit" class="main-btn">
                        Register Shelter
                    </button>
                </form>
                <div class="switch-area">
                    <span>
                        Return to Home Page
                    </span>
                    <a href="/"><button type="button" class="switch-circle"><i
                                class="fa-solid fa-house"></i></button></a>
                </div>
            </div>

        </div>
    </div>
</body>

</html>
