<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register Shelter</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container my-5" style="max-width: 500px;">
        <div class="card shadow p-4">
            <h2 class="mb-3 text-secondary">Register New Shelter</h2>

            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Shelter ID:</label>
                    <input type="text" name="shelter_id" class="form-control" required placeholder="e.g., SH-101">
                </div>
                <div class="mb-3">
                    <label class="form-label">Shelter Name:</label>
                    <input type="text" name="name" class="form-control" required placeholder="e.g., Community Center Shelter">
                </div>
                <div class="mb-3">
                    <label class="form-label">Priority Level:</label>
                    <select name="priority" class="form-select" required>
                        <option value="Critical">Critical</option>
                        <option value="High">High</option>
                        <option value="Moderate" selected>Moderate</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Location Coordinates:</label>
                    <input type="text" name="coordinates" class="form-control" placeholder="e.g., 25.2048, 55.2708">
                </div>
                <button type="submit" class="btn btn-secondary w-100">Register Shelter</button>
                <a href="/" class="btn btn-link w-100 mt-2">Back to Dashboard</a>
            </form>
        </div>
    </div>
</body>
</html>
